<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGradLI" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FBF6EC"/>
      <stop offset="100%" stop-color="#F0E7D6"/>
    </radialGradient>
    <linearGradient id="bronzeGradLI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A5A2B"/>
      <stop offset="100%" stop-color="#4A3218"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="240" cy="240" r="216" fill="url(#bgGradLI)" stroke="#E4D7BE" stroke-width="1"/>
  <circle cx="240" cy="240" r="216" fill="none" stroke="url(#bronzeGradLI)" stroke-width="2.5"/>
  <circle cx="240" cy="240" r="196" fill="none" stroke="url(#bronzeGradLI)" stroke-width="1" opacity="0.5"/>

  <!-- pizza slice, monoline -->
  <g transform="translate(240,252) rotate(-12)">
    <path d="M 0 96 L -70 -30 Q 0 -58 70 -30 Z" fill="none" stroke="url(#bronzeGradLI)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -70 -30 Q 0 -58 70 -30" fill="none" stroke="url(#bronzeGradLI)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -60 -20 Q 0 -42 60 -20" fill="none" stroke="url(#bronzeGradLI)" stroke-width="1.4" opacity="0.7"/>
    <path d="M -20 60 L -14 20" stroke="url(#bronzeGradLI)" stroke-width="1.4" opacity="0.6" stroke-linecap="round"/>
    <path d="M 18 66 L 12 24" stroke="url(#bronzeGradLI)" stroke-width="1.4" opacity="0.6" stroke-linecap="round"/>
    <circle cx="-16" cy="0" r="9" fill="none" stroke="url(#bronzeGradLI)" stroke-width="2"/>
    <circle cx="20" cy="18" r="8" fill="none" stroke="url(#bronzeGradLI)" stroke-width="2"/>
    <circle cx="0" cy="40" r="7" fill="none" stroke="url(#bronzeGradLI)" stroke-width="2"/>
  </g>

  <!-- delicate motion arc -->
  <path d="M 108 210 Q 96 240 108 270" fill="none" stroke="url(#bronzeGradLI)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M 92 218 Q 78 240 92 262" fill="none" stroke="url(#bronzeGradLI)" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>
